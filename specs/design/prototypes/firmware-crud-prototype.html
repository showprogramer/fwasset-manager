/* ============================================================
   8. 事件
   ============================================================ */
function openFolder(row) {
  const a = row.kind === "borrow" ? borrowTarget(row.borrow) : row.asset;
  if (!a) { toast("warn", "打不开", "来源程序找不到了"); return; }
  const total = a.files.length + (a.extraFiles?.length || 0);
  toast("info", "已打开文件夹（模拟）", a.extraFiles?.length
    ? `${folderOf(a)} · 文件夹里共 ${total} 个文件（含 ${a.extraFiles.length} 个介绍文件）`
    : folderOf(a));
}

function runAction(action) {
  const row = selectedRow();
  if (!row) return;
  if (row.kind === "borrow") {
    if (action === "editBorrow") addDialog("borrow", row.borrow);
    else if (action === "stopBorrow") stopBorrowDialog(row.borrow);
    return;
  }
  const a = row.asset;
  if (action === "default") setDefault(a);
  else if (action === "rename") { state.renaming = true; renderTable(); renderInspector(); focusInlineRename(); }
  else if (action === "update") updateDialog(a);
  else if (action === "backups") backupsDialog(a);
  else if (action === "delete") deleteDialog(a);
  else if (action === "usb") usbDialog(a);
}

function select(id) {
  if (state.selectedId === id) return;
  state.selectedId = id;
  state.renaming = false;
  renderTable();
  renderInspector();
}

let modelContextId = null;
let schemeContextId = null;

function showModelContext(event, modelId) {
  const model = MODELS.find(item => item.id === modelId);
  if (!model) return;
  event.preventDefault();
  modelContextId = modelId;
  const menu = $("#context");
  menu.innerHTML = `<button type="button" data-act="renameModel">重命名型号</button>
    <button class="danger" type="button" data-act="deleteModel">删除型号</button>`;
  menu.hidden = false;
  menu.style.left = `${Math.min(event.clientX, innerWidth - 218)}px`;
  menu.style.top = `${Math.min(event.clientY, innerHeight - 76)}px`;
}

/* 定制方案右键：重命名 / 删除 */
function showSchemeContext(event, schemeId) {
  const scheme = SCHEMES.find(item => item.id === schemeId);
  if (!scheme) return;
  event.preventDefault();
  schemeContextId = schemeId;
  const menu = $("#context");
  menu.innerHTML = `<button type="button" data-act="renameScheme">重命名方案</button>
    <button class="danger" type="button" data-act="deleteScheme">删除方案</button>`;
  menu.hidden = false;
  menu.style.left = `${Math.min(event.clientX, innerWidth - 218)}px`;
  menu.style.top = `${Math.min(event.clientY, innerHeight - 90)}px`;
}

/* 型号下拉 */
function openModelPop(open) {
  $("#modelPop").hidden = !open;
  $("#modelButton").setAttribute("aria-expanded", String(open));
  if (open) {
    $("#modelSearch").value = "";
    renderModelPicker();
    $("#modelSearch").focus();
  }
}
$("#modelButton").addEventListener("click", () => openModelPop($("#modelPop").hidden));
$("#modelSearch").addEventListener("input", renderModelPicker);
$("#modelSearch").addEventListener("keydown", e => {
  if (e.key === "Escape") { openModelPop(false); $("#modelButton").focus(); }
  if (e.key === "Enter") {
    const first = $("#modelList .model-option");
    if (first) first.click();
  }
});
$("#modelList").addEventListener("click", e => {
  if (e.target.closest("[data-act='newModel']")) { openModelPop(false); newModelDialog(); return; }
  const option = e.target.closest("[data-model]");
  if (!option) return;
  state.model = option.dataset.model;
  state.scope = "all";
  state.type = "all";
  state.selectedId = null;
  openModelPop(false);
  render();
});

$("#modelList").addEventListener("contextmenu", e => {
  const option = e.target.closest("[data-model]");
  if (!option) return;
  showModelContext(e, option.dataset.model);
});

/* 通用/定制 */
$("#navScopes").addEventListener("click", e => {
  if (e.target.closest('[data-act="newScheme"]')) { newSchemeDialog(); return; }
  const button = e.target.closest("[data-scope]");
  if (!button) return;
  state.scope = button.dataset.scope;
  state.type = "all";
  render();
});
$("#navScopes").addEventListener("contextmenu", e => {
  const button = e.target.closest("[data-scheme]");
  if (!button) return;
  showSchemeContext(e, button.dataset.scheme);
});

/* 筛选 */
$("#chips").addEventListener("click", e => {
  const chip = e.target.closest("[data-type]");
  if (!chip) return;
  state.type = chip.dataset.type;
  render();
});
$("#search").addEventListener("input", e => { state.query = e.target.value.trim().toLocaleLowerCase(); renderTable(); renderInspector(); });
$("#btnAdd").addEventListener("click", () => { if (state.model) addDialog(); });
$("#btnSettings").addEventListener("click", settingsDialog);
$("#openRecycleBin").addEventListener("click", recycleBinDialog);

/* 表格 */
$("#rows").addEventListener("click", e => {
  const tr = e.target.closest("[data-id]");
  if (tr) select(tr.dataset.id);
});
$("#rows").addEventListener("dblclick", e => {
  const tr = e.target.closest("[data-id]");
  if (!tr) return;
  select(tr.dataset.id);
  const row = selectedRow();
  if (row) openFolder(row);
});
$("#rows").addEventListener("contextmenu", e => {
  const tr = e.target.closest("[data-id]");
  if (!tr) return;
  e.preventDefault();
  select(tr.dataset.id);
  const row = selectedRow();
  if (!row) return;
  const menu = $("#context");
  modelContextId = null;
  menu.innerHTML = row.kind === "borrow"
    ? `<button type="button" data-act="editBorrow">换一个来源</button>
       <button type="button" data-act="stopBorrow">不再用别的型号的程序</button>`
    : `<button type="button" data-act="update">更新程序</button>
       <button class="danger" type="button" data-act="delete">删除程序</button>`;
  menu.hidden = false;
  menu.style.left = `${Math.min(e.clientX, innerWidth - 218)}px`;
  const menuHeight = row.kind === "borrow" ? 90 : 90;
  menu.style.top = `${Math.min(e.clientY, innerHeight - menuHeight)}px`;
});
$("#rows").addEventListener("keydown", e => {
  if (!e.target.dataset.inlineRename) return;
  if (e.key === "Enter") { e.preventDefault(); commitRename(); }
  if (e.key === "Escape") { e.preventDefault(); cancelRename(); }
});
$("#rows").addEventListener("focusout", e => {
  if (!e.target.dataset.inlineRename) return;
  commitRename();
});
$("#context").addEventListener("click", e => {
  const button = e.target.closest("[data-act]");
  if (!button) return;
  $("#context").hidden = true;
  if (schemeContextId && (button.dataset.act === "renameScheme" || button.dataset.act === "deleteScheme")) {
    runSchemeAction(button.dataset.act, schemeContextId);
    schemeContextId = null;
    return;
  }
  if (modelContextId && (button.dataset.act === "renameModel" || button.dataset.act === "deleteModel")) {
    runModelAction(button.dataset.act, modelContextId);
    modelContextId = null;
    openModelPop(false);
    return;
  }
  runAction(button.dataset.act);
});

/* 详情栏 */
$("#inspector").addEventListener("click", e => {
  const action = e.target.closest("[data-act]");
  if (action) runAction(action.dataset.act);
});

/* 全局 */
document.addEventListener("click", e => {
  if (!$("#context").contains(e.target)) {
    $("#context").hidden = true;
    modelContextId = null;
    schemeContextId = null;
  }
  if (!$("#modelPop").hidden && !$(".model-picker").contains(e.target)) openModelPop(false);
});

/* 拖进主窗口任意位置 → 直接打开新增程序（Qt 落地：主窗口 setAcceptDrops） */
["dragover", "dragenter"].forEach(type => document.addEventListener(type, e => {
  if (e.dataTransfer) e.preventDefault();
}));
document.addEventListener("drop", e => {
  if (!e.dataTransfer) return;
  const source = sourceFromDrop(e);
  if (!source.path) return;
  if ($("#overlay").hidden) {
    e.preventDefault();
    addDialog("file", null, source);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    $("#context").hidden = true;
    modelContextId = null;
    schemeContextId = null;
    openModelPop(false);
    closeModal();
    if (state.renaming) { state.renaming = false; render(); }
    return;
  }
  if (e.target.matches("input, select, textarea") || !$("#overlay").hidden) return;

  const list = visibleRows();
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && list.length) {
    e.preventDefault();
    const index = list.findIndex(r => r.id === state.selectedId);
    const next = e.key === "ArrowDown" ? Math.min(index + 1, list.length - 1) : Math.max(index - 1, 0);
    select(list[index === -1 ? 0 : next].id);
    const row = $(`tr[data-id="${state.selectedId}"]`);
    if (row) row.scrollIntoView({ block: "nearest" });
    return;
  }
  const row = selectedRow();
  if (!row) return;
  if (e.key === "Enter") { e.preventDefault(); openFolder(row); }
  if (row.kind !== "asset") return;
  if (e.key === "F2") { e.preventDefault(); runAction("rename"); }
  if (e.key === "Delete") { e.preventDefault(); runAction("delete"); }
});

render();
</script>
</body>
</html>
